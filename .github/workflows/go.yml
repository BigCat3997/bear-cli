# Continuous integration for Bear CLI: formatting, vetting, tests and builds.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet $(go list ./... | grep -v /cmd/bear-menu-bar)

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The menu bar app is macOS-only (it needs the system tray and AppKit).
      - name: Select packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "PACKAGES=./..." >> "$GITHUB_ENV"
          else
            echo "PACKAGES=$(go list ./... | grep -v /cmd/bear-menu-bar | tr '\n' ' ')" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: go build -v $PACKAGES

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic $PACKAGES

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build-cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o bear-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/bear

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bear-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bear-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
